[level]
id = "4-1"
title = "The Catalogue"
world = 4
new_concepts = ["dictionaries: keys, values and get()", "looping over dictionaries and nesting", "the counting pattern", "choosing a data structure, with timing and Big-O vocabulary"]
power_up = "lookup"

cutscene = '''
# >> The knowledge base stores everything by name.
import time
bins = {"bolt": {"count": 40, "shelf": "A1"}}   # a dict inside a dict
bins["gear"] = {"count": 12, "shelf": "B2"}
print(bins["gear"]["count"], bins.get("laser", "none"))
for name, info in bins.items():
    print(name, info["shelf"])
seen = {}
for part in ["nut", "cog", "nut"]:
    seen[part] = seen.get(part, 0) + 1       # counting
print(seen, list(seen.keys()), list(seen.values()))
numbers = list(range(100000))
stores = [("list", numbers), ("set", set(numbers)), ("dict", dict(zip(numbers, numbers)))]
for kind, store in stores:
    start = time.perf_counter()
    for attempt in range(200):
        found = 99999 in store
    print(kind, time.perf_counter() - start, "seconds")
# >> Snek: "THE LIST SEARCHES. THE SET AND DICT JUMP."
'''

tips = [
  "A dict maps keys to values: d[key] reads or stores; d.get(key, default) is safe for a missing key.",
  "for key, value in d.items() visits each pair; keys() and values() give one side. A value may be a dict.",
  "To count: counts[x] = counts.get(x, 0) + 1.",
  "in scans a list: O(n), time grows with size. A set or dict jumps to the key: O(1) on average.",
]

