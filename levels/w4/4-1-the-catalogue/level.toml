[[wave]]
kind = "debug"
mode = "choice"
goal = "Choose list, tuple, set or dict for each job."
brief = "Pick the best data structure for each job in the knowledge base."
wrong = "1: b, 2: a, 3: a, 4: a"

[[wave.question]]
ask = "Part names in delivery order, repeats kept, more added later."
options = ["list", "tuple", "set", "dict"]
answer = "a"
explanation = "A list keeps order and repeats, and it can grow."

[[wave.question]]
ask = "A sensor's fixed position (x, y) that must never change."
options = ["list", "tuple", "set", "dict"]
answer = "b"
explanation = "A tuple is a fixed record: it cannot be changed."

[[wave.question]]
ask = "Serial numbers already scanned: no repeats, fast membership test."
options = ["list", "tuple", "set", "dict"]
answer = "c"
explanation = "A set holds each item once, and in is O(1) on average."

[[wave.question]]
ask = "Find a part's shelf quickly from its name."
options = ["list", "tuple", "set", "dict"]
answer = "d"
explanation = "A dict maps each name (key) to its shelf (value)."
