[[wave]]
kind = "build"
goal = "Build a parts catalogue, then time a search."
brief = '''
Delivery i brought counts[i] parts called names[i]; build the dict catalogue of totals, print name: total per part in order of first delivery, then the total for wanted (0 if absent).
Print TOTAL with the sum of its values(), and PARTS with the sorted list of its keys().
Then time wanted in a list, a set and the dict, using time.perf_counter() before and after.
Print TIME list, TIME set and TIME dict, each followed by its seconds.
'''
starter = '''
import time

names = ["bolt", "gear", "bolt"]
counts = [10, 4, 5]
wanted = "laser"
'''
reference = '''
import time

names = ["bolt", "gear", "bolt"]
counts = [10, 4, 5]
wanted = "laser"
# add up the count for each part name
catalogue = {}
for name, count in zip(names, counts):
    catalogue[name] = catalogue.get(name, 0) + count
for name, total in catalogue.items():
    print(f"{name}: {total}")
print(catalogue.get(wanted, 0))
print("TOTAL", sum(catalogue.values()))
print("PARTS", sorted(catalogue.keys()))

# time the same search in three structures
stores = [("list", list(catalogue)), ("set", set(catalogue)), ("dict", catalogue)]
for kind, store in stores:
    start = time.perf_counter()
    found = wanted in store
    print("TIME", kind, time.perf_counter() - start)
'''
wrong = '''
import time

names = ["bolt", "gear", "bolt"]
counts = [10, 4, 5]
wanted = "laser"
# keeps only the last count for each name
