[[wave]]
kind = "debug"
mode = "review"
goal = "Mark each faulty line and name its fault."
brief = """
Review this solution. average_valid(readings) must return the average of the
readings from 0 to 100, limits included, or None if there are none.
"""
code = '''
def average_valid(readings):
    """Average the readings from 0 to 100, or None."""
    total = 0
    count = 0
    for reading in readings:
        if reading > 0 and reading <= 100:
            total += reading
            count += 1
    if count < 0:
        return None
    return total // count
'''
categories = ["a valid reading is left out", "no readings is not caught",
              "the fraction is lost", "an invalid reading is counted"]
wrong = "3: a"
hints = [
  "Test it in your head with [0], with [] and with [1, 2].",
  "Check the lower limit, the guard before dividing, and the division itself.",
  "One fault is on line 6.",
]

[[wave.fault]]
line = 6
category = "a"
explanation = "> 0 leaves out 0, which is a valid reading."

[[wave.fault]]
line = 9
category = "b"
explanation = "count is never below 0, so no readings divides by zero."

[[wave.fault]]
line = 11
category = "c"
explanation = "// drops the fraction; an average needs /."
