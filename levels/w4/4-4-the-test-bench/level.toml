[level]
id = "4-4"
title = "The Test Bench"
world = 4
new_concepts = ["black-box and glass-box test design", "boundary cases", "assert-based test functions", "systematic debugging and reviewing a provided solution"]
power_up = "test"

cutscene = '''
# >> Every repair in the Core breaks an older one.
# >> Snek drags a dusty test bench into the light.
def is_low(charge):
    """Return True when charge is under 20."""
    return charge < 20

def test_is_low():
    """Check both sides of the limit."""
    assert is_low(19)
    assert not is_low(20)

test_is_low()
print("ALL PASS")
# >> Snek: "NOW BREAKAGE HAS TO ANNOUNCE ITSELF."
'''

tips = [
  "Black-box tests come from the spec; glass-box tests come from reading the code's branches.",
  "A boundary case sits at a limit or just beside it, such as 19 and 20, an empty list or the last item.",
  "A test function holds assert lines; a False assert raises AssertionError.",
  "Debug in steps: reproduce, change one input, find the line, fix, rerun all tests. Review line by line.",
]

[[wave]]
kind = "fill-in"
goal = "Pick boundary inputs that catch an off-by-one."
brief = """
is_overheating(temp) must return True only when the whole number temp is
above 80. Fill each blank with the input that sits right at that limit, so the
tests pass the good version and catch the broken ones.
"""
starter = '''
version = "good"  # the bench also tries broken versions

def is_overheating(temp):
    """Return True when temp is above 80."""
    if version == "early":
        return temp >= 80
    if version == "late":
        return temp > 81
    return temp > 80

def test_is_overheating():
    """Check both sides of the limit."""
    assert not is_overheating(___)
    assert is_overheating(___)

try:
    test_is_overheating()
    print("ALL PASS")
except AssertionError:
    print("BUG FOUND")
'''
reference = '''
version = "good"  # the bench also tries broken versions

def is_overheating(temp):
    """Return True when temp is above 80."""
    if version == "early":
        return temp >= 80
    if version == "late":
        return temp > 81
    return temp > 80

def test_is_overheating():
    """Check both sides of the limit."""
    assert not is_overheating(80)
    assert is_overheating(81)

try:
    test_is_overheating()
    print("ALL PASS")
except AssertionError:
    print("BUG FOUND")
'''
wrong = '''
version = "good"  # the bench also tries broken versions

def is_overheating(temp):
    """Return True when temp is above 80."""
    if version == "early":
