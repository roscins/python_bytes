[[wave]]
kind = "build"
goal = "Find and fix two hidden bugs by experiment."
brief = """
count_safe(readings, low, high) must count the readings from low to high,
both limits included. It hides two bugs, so experiment with short lists that
probe the edges. Fix both bugs. Add a function test_count_safe() with assert
lines, and call it.
"""
starter = '''
def count_safe(readings, low, high):
    """Count the readings from low to high, limits included."""
    count = 0
    for index in range(1, len(readings)):
        if readings[index] >= low and readings[index] < high:
            count += 1
    return count

# Experiment here.
print(count_safe([15, 15, 15], 10, 20))
'''
reference = '''
def count_safe(readings, low, high):
    """Count the readings from low to high, limits included."""
    count = 0
    for reading in readings:
        if reading >= low and reading <= high:
            count += 1
    return count

def test_count_safe():
    """Probe the first item, both limits and an empty list."""
    assert count_safe([15], 10, 20) == 1
    assert count_safe([9, 10, 20, 21], 10, 20) == 2
    assert count_safe([], 10, 20) == 0

# Run the tests after every change.
test_count_safe()
'''
wrong = '''
def count_safe(readings, low, high):
    """Count the readings from low to high, limits included."""
    count = 0
    for reading in readings:
        if reading >= low and reading < high:
            count += 1
    return count

def test_count_safe():
    """Probe the first item only."""
    assert count_safe([15], 10, 20) == 1

# Run the tests.
test_count_safe()
'''
hints = [
  "Try a list with one reading. Then try a reading equal to each limit.",
  "Check which index the loop starts at, and how each limit is compared.",
  "Loop with: for reading in readings, then compare reading with both limits.",
]

[[wave.test]]
call = "count_safe"
args = [[15], 10, 20]
expected = 1

[[wave.test]]
call = "count_safe"
args = [[10, 20], 10, 20]
expected = 2

[[wave.test]]
call = "count_safe"
args = [[4, 5, 6, 8, 9, 10], 5, 9]
expected = 4

[[wave.test]]
call = "count_safe"
args = [[], 0, 5]
expected = 0

