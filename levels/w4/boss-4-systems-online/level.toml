[[wave]]
kind = "boss"
goal = "Write warnings.txt from sensors.csv, with assert tests."
files = ["sensors.csv"]
brief = """
sensors.csv has a header, then name,value,limit rows.
is_warning(value, limit): True if value is above limit.
total(numbers): their sum, by recursion (0 if empty).
build_report(rows): rows are [name, value, limit] texts. Return lines:
WARN name value per warning, in order; COUNT name n per warned name (use a
dict), by first warning; EXCESS total of value - limit; SKIPPED n (non-numbers).
Numbers have 1 decimal, except counts. Write the lines to warnings.txt.
Write test_is_warning() with asserts.
Start the file with at least 3 comment lines of plan.
"""
starter = '''
import csv
'''
reference = '''
# Plan: judge one reading
# Then: build the report lines
# Last: read and write the files
import csv


def is_warning(value, limit):
    """Return True if value is above limit."""
    return value > limit


def total(numbers):
    """Return the sum of numbers, by recursion."""
    if len(numbers) == 0:
        return 0
    return numbers[0] + total(numbers[1:])


def build_report(rows):
    """Return the report lines for rows of [name, value, limit] text."""
    lines = []
    skipped = 0
    counts = {}
    excess = []
    for name, value_text, limit_text in rows:
        try:
            value = float(value_text)
            limit = float(limit_text)
        except ValueError:
            skipped += 1
            continue
        if is_warning(value, limit):
            lines.append(f"WARN {name} {value:.1f}")
            counts[name] = counts.get(name, 0) + 1
            excess.append(value - limit)
    for name, count in counts.items():
        lines.append(f"COUNT {name} {count}")
    lines.append(f"EXCESS {total(excess):.1f}")
    lines.append(f"SKIPPED {skipped}")
    return lines


def test_is_warning():
    """Check both sides of the limit and the limit itself."""
    assert is_warning(11, 10)
    assert not is_warning(10, 10)
    assert not is_warning(9, 10)


test_is_warning()
with open("sensors.csv", newline="") as source:
    reader = csv.reader(source)
    next(reader)
    report = build_report(reader)
with open("warnings.txt", "w") as target:
    for line in report:
        target.write(line + "\n")
'''
