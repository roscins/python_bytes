[[wave]]
kind = "build"
goal = "Write is_palindrome, fib and fib_memo with call counts."
brief = """
Without loops, write recursive is_palindrome(text), returning True or False, plus fib(n, calls) and fib_memo(n, memo, calls), where fib(0) is 0, fib(1) is 1 and later numbers add the two before.
Both Fibonacci functions add 1 to calls[0] every time they are called, and fib_memo returns a stored memo[n] if there is one, otherwise stores each result it adds up.
Keep word = "LEVEL" and n = 10 as the top lines, then print Palindrome: and is_palindrome(word).
Call fib(n, calls) with calls = [0] and print Plain:, the result and calls[0]; then do the same with fib_memo, an empty dict and a new counter, printing Memo:.
Keep the docstrings and a # comment.
"""
starter = '''
word = "LEVEL"
n = 10

def is_palindrome(text):
    """Return True if text reads the same both ways."""
    pass

def fib(n, calls):
    """Return Fibonacci number n, counting calls in calls[0]."""
    pass

def fib_memo(n, memo, calls):
    """Return Fibonacci number n, remembering results in memo."""
    pass

# Print the three result lines below.
'''
reference = '''
word = "LEVEL"
n = 10

def is_palindrome(text):
    """Return True if text reads the same both ways."""
    if len(text) <= 1:
        return True
    if text[0] != text[-1]:
        return False
    return is_palindrome(text[1:-1])

def fib(n, calls):
    """Return Fibonacci number n, counting calls in calls[0]."""
    calls[0] += 1
    if n <= 1:
        return n
    return fib(n - 1, calls) + fib(n - 2, calls)

def fib_memo(n, memo, calls):
    """Return Fibonacci number n, remembering results in memo."""
    calls[0] += 1
    if n <= 1:
        return n
    if n in memo:
        return memo[n]
    memo[n] = fib_memo(n - 1, memo, calls) + fib_memo(n - 2, memo, calls)
    return memo[n]

# Compare the call counts
print("Palindrome:", is_palindrome(word))
calls = [0]
result = fib(n, calls)
print("Plain:", result, calls[0])
calls = [0]
result = fib_memo(n, {}, calls)
print("Memo:", result, calls[0])
'''
