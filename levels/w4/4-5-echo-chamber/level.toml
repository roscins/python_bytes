[[wave]]
kind = "debug"
goal = "Fix three bugs in the relay report."
brief = """
mirror must return text backwards, loudest must return the largest number in a non-empty list, and relays must count each call in calls[0] and reuse results through memo.
There are three bugs; fix them.
"""
starter = '''
def mirror(text):
    """Return text backwards."""
    if len(text) <= 1:
        return text
    return text[-1] + mirror(text[1:-1]) + text[-1]

def loudest(levels):
    """Return the largest number in a non-empty list."""
    if len(levels) == 1:
        return levels[0]
    best = loudest(levels[1:])
    if levels[0] > best:
        return levels[0]

def relays(n, memo, calls):
    """Return the signals at station n; 1 at stations 0 and 1."""
    calls[0] += 1
    if n <= 1:
        return 1
    if n in memo:
        return memo[n]
    result = relays(n - 1, memo, calls) + relays(n - 2, memo, calls)
    return result

word = "ECHO"
station = 12
print("Mirror:", mirror(word))
print("Loudest:", loudest([3, 9, 4]))
calls = [0]
print("Signals:", relays(station, {}, calls), calls[0])
'''
