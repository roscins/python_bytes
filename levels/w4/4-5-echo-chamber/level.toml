[level]
id = "4-5"
title = "Echo Chamber"
world = 4
new_concepts = ["recursion: base case and recursive case", "inductive reasoning", "recursion on lists and strings", "memoisation with a dictionary"]
power_up = "echo"

cutscene = '''
# >> A message bounces between relay stations, each passing it on.
def count_letters(message):
    """Return how many characters message has."""
    if message == "":                           # base case
        return 0
    return 1 + count_letters(message[1:])       # recursive case

def paths(stairs, memo):
    """Return the ways to climb stairs in steps of 1 or 2."""
    if stairs <= 1:
        return 1
    if stairs not in memo:
        memo[stairs] = paths(stairs - 1, memo) + paths(stairs - 2, memo)
    return memo[stairs]

print(count_letters("PING"))
print(paths(30, {}))
# >> Snek: "EACH STATION DOES ONE SMALL PART."
'''

tips = [
  "A recursive function calls itself. The base case returns without a call; the recursive case moves toward it.",
  "Reason by induction: check the base case, then trust the smaller call and check the one step built on it.",
  "text[0] or items[0] is the first item and text[1:] or items[1:] the rest; an empty one is a usual base case.",
  "Memoisation: look the argument up in a dict first; if it is missing, compute it, store it, then return it.",
]

