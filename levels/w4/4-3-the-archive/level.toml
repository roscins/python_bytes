[level]
id = "4-3"
title = "The Archive"
world = 4
new_concepts = ["reading and writing files with open() and with", "the csv module", "pathlib.Path", "validating input data"]
power_up = "save"

cutscene = '''
# >> Deep in the Core, Snek finds long-term memory: a folder of logs.
import csv
from pathlib import Path

path = Path("memo.csv")       # a file name as a Path object
with open(path, "w", encoding="utf-8") as memo:   # "w" writes
    memo.write("name,charge\n")
    memo.write("snek,80\n")
    memo.write("drone,??\n")
print(path.exists())
with open(path, encoding="utf-8", newline="") as memo:
    reader = csv.reader(memo)
    header = next(reader)     # take the first row
    for row in reader:        # each row is a list of strings
        if row[1].isdigit():  # check before converting
            print(row[0], int(row[1]))
        else:
            print("skipped", row)
# >> Snek: "SOME OF MY MEMORIES ARE CORRUPT. CHECK BEFORE TRUSTING."
'''

tips = [
  "with open(name, \"w\", encoding=\"utf-8\") as f: f.write(text). The file closes after the block.",
  "csv.reader(f) gives each row as a list of strings. next(reader) takes one row, such as the header.",
  "Path(\"memo.csv\") is a file name as an object. Its exists() says if the file is there.",
  "Check data before using it: count the fields, test with isdigit() or catch ValueError.",
]

