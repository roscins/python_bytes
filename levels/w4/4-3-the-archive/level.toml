[[wave]]
kind = "build"
goal = "Report bad rows, save a summary, draw a bar chart."
brief = '''
If Path(log_name) does not exist(), print NO LOG and stop there. It has a header, then sensor,value rows,
valid with exactly 2 fields and a whole number from 0 to 100 (isdigit() helps).
For each invalid row print SKIP and its line number, such as SKIP 3 (the header is line 1).
Then print a chart line for each valid row, in file order: the sensor left-aligned
in 8, then one # for every full 10 units. Write summary.txt with two lines,
valid: and skipped:, each followed by a space and its count.
'''
files = ["readings.csv"]
starter = '''
import csv
from pathlib import Path

log_name = "readings.csv"
'''
reference = '''
import csv
from pathlib import Path

log_name = "readings.csv"
# Check every row, then chart the good ones and save the counts
source = Path(log_name)
if source.exists():
    names = []
    values = []
    skipped = 0
    with open(source, encoding="utf-8", newline="") as log:
        reader = csv.reader(log)
        next(reader)
        for number, row in enumerate(reader, start=2):
            if len(row) == 2 and row[1].isdigit() and int(row[1]) <= 100:
                names.append(row[0])
                values.append(int(row[1]))
            else:
                print(f"SKIP {number}")
                skipped += 1
    for name, value in zip(names, values):
        bar = "#" * (value // 10)
        print(f"{name:<8}{bar}")
    with open("summary.txt", "w", encoding="utf-8") as summary:
        summary.write(f"valid: {len(names)}\n")
        summary.write(f"skipped: {skipped}\n")
else:
    print("NO LOG")
'''
