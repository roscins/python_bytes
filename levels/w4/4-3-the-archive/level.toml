[[wave]]
kind = "debug"
goal = "Fix three bugs so report.txt is right."
brief = "This should skip invalid rows, then write the number of good rows and their crate total to report.txt on two lines. Fix the three bugs."
files = ["archive.csv"]
starter = '''
import csv
from pathlib import Path

# Count the good rows of the archive and add up their crates
source = Path("archive.csv")
count = 0
total = 0
if source.exists():
    with open(source, encoding="utf-8", newline="") as archive:
        reader = csv.reader(archive)
        next(reader)
        for row in reader:
            if len(row) == 2 or row[1].isdigit():
                count += 1
                total = int(row[1])
with open("report.txt", "w", encoding="utf-8") as report:
    report.write(f"rows: {count}")
    report.write(f"total: {total}")
print("saved")
'''
