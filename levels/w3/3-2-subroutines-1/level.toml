[[wave]]
kind = "debug"
goal = "Fix three bugs in the obstacle report."
brief = '''
first_obstacle(line) should return the index of the first # in the line it is
given, or None if that line has no #. describe(line) should return the report
text, which the loop prints. There are three bugs: fix them all.
'''
starter = '''
row = "...#."
spare = "....."

def first_obstacle(line):
    """Return the index of the first # in line, or None."""
    for index in range(len(line)):
        if row[index] == "#":
            return index
        return None

def describe(line):
    """Return the report text for one line of the floor."""
    print(f"FIRST #: {first_obstacle(line)}")

# Report both rows of the floor
for floor_row in [row, spare]:
    print(describe(floor_row))
'''
