[level]
id = "3-5"
title = "Fixed Records"
world = 3
new_concepts = ["tuples in depth: immutability and unpacking", "sets and set algebra", "zip()", "enumerate()"]
power_up = "compare"

cutscene = '''
# >> The sensor vault holds history. History is compared, never edited.
record = (900, "heat")        # a tuple cannot be changed after it is made
time, sensor = record         # unpacking: one name for each item
print(time, sensor)
monday = {"heat", "gas"}      # a set: no repeats, no fixed order
tuesday = set(["gas", "tilt", "gas"])   # a set made from a list
print(sorted(monday & tuesday))   # in both
print(sorted(monday ^ tuesday))   # in only one
print(sorted(monday | tuesday))   # in either
print(sorted(monday - tuesday))   # in monday only
alerts = set()                # an empty set ({} is not a set)
alerts.add("gas")
alerts.add("gas")             # already there, so nothing changes
print(sorted(alerts))
history = tuple(zip([900, 915], [21, 48]))   # pairs, frozen in a tuple
print(history)
for number, name in enumerate(["heat", "gas"]):          # counts from 0
    print(number, name)
for number, (time, reading) in enumerate(history, 1):    # counts from 1
    print(number, time, reading)
# >> Snek: "RECORDS SEALED. COMPARISON ONLINE."
'''

tips = [
  "A tuple such as (900, 21) cannot be changed; a, b = pair unpacks it. tuple(items) makes a tuple.",
  "A set ({1, 2}, set(items), empty: set()) has no repeats; add() adds. & both, ^ only one, | either, a - b only a.",
  "zip(a, b) pairs the items of two lists by position, and stops at the end of the shorter one.",
  "for n, item in enumerate(items, 1): gives each item with its number. Without the 1, n starts at 0.",
]

