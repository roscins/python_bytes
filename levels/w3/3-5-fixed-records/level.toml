goal = "Freeze the history, number it and collect alert times."
brief = '''
Set history to tuple(zip(times, readings)) and print it.
Loop over enumerate(history, 1), unpack each record, and print one line per record in the form 1: 900 = 21 (number, time, reading).
Add the time of every reading above limit (equal does not count) to a set named alerts, which starts as set(), so a repeated time is kept once.
After the loop, print sorted(alerts).
Keep the starter lines, and use no indexing, while, + or +=, because zip() and enumerate() do the pairing and counting.
'''
starter = '''
first = 21
limit = 40
times = [900, 915, 915, 945]
readings = [first, 48, 55, 40]
'''
reference = '''
