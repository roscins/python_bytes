[[wave]]
kind = "debug"
goal = "Fix three bugs without editing the sensor history."
brief = '''
compare_runs() must return three sorted lists (sensors in both runs, in only one run, in either run) from two runs of history, stored as tuples, which cannot be changed.
numbered() must return lines such as "1. gas", counting from 1.
There are three bugs; fix them and keep the lines below the functions.
'''
starter = '''
def compare_runs(old_run, new_run):
    """Return sensors in both runs, in only one, and in either."""
    old_run.sort()
    old = set(old_run)
    new = set(new_run)
    both = old & new
    either = old | new
    only_one = old ^ both
    return sorted(both), sorted(only_one), sorted(either)


def numbered(names):
    """Return one numbered line for each name, counting from 1."""
    lines = []
    for number, name in enumerate(names):
        lines.append(f"{number}. {name}")
    return lines


first_run = ("tilt", "gas", "heat")
second_run = ("sound", "heat", "gas")
both, only_one, either = compare_runs(first_run, second_run)
print(both)
print(numbered(only_one))
print(either)
print(first_run)
'''
