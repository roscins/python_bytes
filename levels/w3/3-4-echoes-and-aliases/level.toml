[level]
id = "3-4"
title = "Echoes and Aliases"
world = 3
new_concepts = ["mutability and aliasing", "is versus ==", "cloning with slices and copy", "the mutable default argument trap"]
power_up = "clone"

cutscene = '''
# >> You change one robot's settings. A second robot changes too.
import copy
arm = ["arm", 40]
echo = arm                 # a second name for the SAME list
echo[1] = 99
print(arm, echo is arm)    # ['arm', 99] True
twin = arm[:]              # a clone; arm.copy() and copy.copy(arm) do the same
print(twin == arm, twin is arm, id(twin) == id(arm))   # True False False
racks = [["saw"], ["lamp"]]
shallow = racks.copy()     # new outer list, SAME inner lists
deep = copy.deepcopy(racks)             # inner lists are cloned too
racks[0].append("drill")
print(shallow[0], deep[0])  # ['saw', 'drill'] ['saw']
def remember(word, seen=[]):         # trap: this [] is made only once
    seen.append(word)
    return seen
remember("a")
print(remember("b"))        # ['a', 'b']
def recall(word, seen=None):         # fix: make the list inside
    if seen is None:
        seen = []
    seen.append(word)
    return seen
# >> Snek: "TWO NAMES. ONE LIST. THERE IS YOUR GHOST."
'''

tips = [
  "Lists are mutable: after b = a, both names mean one list, so changing b changes a.",
  "a == b asks for equal values; a is b asks for the very same object (id(a) == id(b)). Test with: is None.",
  "a[:], a.copy() and copy.copy(a) clone only the outer list; copy.deepcopy(a) clones inner lists too.",
  "A default like seen=[] is made once and shared by calls; use seen=None, then if seen is None: seen = [].",
]

