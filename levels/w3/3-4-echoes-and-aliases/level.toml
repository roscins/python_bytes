Write make_variant(robot, new_name, new_tool), with a docstring, for a record robot = [name, speed, tools].
It returns a clone with the name replaced and new_tool appended to the clone's tools, leaving robot and its tools list unchanged.
Keep the starter lines, then set welder = make_variant(template, "welder", new_tool).
Print template, then welder, then welder[2] is template[2], each on its own line.
Add a # comment.
"""
starter = '''
import copy

new_tool = "torch"
template = ["unit", 40, ["gripper"]]
'''
reference = '''
import copy

new_tool = "torch"
template = ["unit", 40, ["gripper"]]


def make_variant(robot, new_name, new_tool):
    """Return a renamed clone of robot with one more tool."""
    # deepcopy also clones the inner tools list
    variant = copy.deepcopy(robot)
    variant[0] = new_name
    variant[2].append(new_tool)
    return variant


welder = make_variant(template, "welder", new_tool)
print(template)
print(welder)
print(welder[2] is template[2])
'''
