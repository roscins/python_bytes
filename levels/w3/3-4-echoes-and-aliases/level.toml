[[wave]]
kind = "debug"
goal = "Fix three aliasing bugs so no robot echoes another."
brief = """
This program has three aliasing bugs; fix all three. tune() must return a changed clone and leave the list it was given unchanged.
log_event() called without a log must start a new list every time, and called with a log must add to that log.
spare_rack must be a clone of rack that shares no list with it, inner lists included.
Keep the names, the first three variables and the print lines.
"""
starter = '''
import copy

boost = 90
new_tool = "saw"
first_event = "boot"


def log_event(event, log=[]):
    """Add event to log (a new log if none is given) and return it."""
    log.append(event)
    return log


def tune(settings, speed):
    """Return a copy of settings with a new speed."""
    tuned = settings
    tuned[1] = speed
    return tuned


base = ["arm", 40]
fast = tune(base, boost)
rack = [["gripper"], ["lamp"]]
spare_rack = rack[:]
spare_rack[0].append(new_tool)
print("Base:", base, "Fast:", fast)
print("Welder log:", log_event(first_event))
print("Painter log:", log_event("paint"))
print("Rack:", rack, "Spare:", spare_rack)
'''
