[[wave]]
kind = "debug"
goal = "Fix three bugs in the calibration report."
brief = """
spread must return what its docstring says, and average must give the mean of only the readings left after dropping the skip lowest.
newton_root must find a square root within the tolerance.
There are three bugs; fix them.
"""

starter = '''
# Calibration report for the vault sensors
def newton_root(target, tolerance=0.001):
    """Return the square root of target and the number of tries."""
    guess = target
    tries = 0
    while abs(guess ** 2 - target) >= tolerance:
        guess = guess - (guess ** 2 - target) / 2 * guess
        tries += 1
    return guess, tries

def spread(readings):
    """Return the lowest reading, then the highest."""
    return max(readings), min(readings)

def average(readings, skip=0):
    """Return the mean after leaving out the skip lowest readings."""
    kept = sorted(readings)[skip:]
    return sum(kept) / len(readings)

peak = 25
readings = [16, 4, peak, 9]
low, high = spread(readings)
print("Range:", low, high)
print("Mean:", round(average(readings), 2))
print("Trimmed:", round(average(readings, skip=1), 2))
root, tries = newton_root(high)
print("Root:", round(root, 2))
'''
