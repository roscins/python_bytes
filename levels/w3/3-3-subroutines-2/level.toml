[level]
id = "3-3"
title = "Subroutines II"
world = 3
new_concepts = ["default and keyword arguments", "returning several values", "min, max, sum and sorted", "decomposition, specifications and Newton-Raphson"]
power_up = "refactor"

cutscene = '''
# >> The vault's control code is one long block. Nobody dares touch it.
# >> You cut it into small functions, each with a stated job.
def stats(values, digits=1):          # digits has a default value
    """Return the lowest, highest and mean of values."""
    mean = sum(values) / len(values)
    return min(values), max(values), round(mean, digits)

def cube_root(target, tolerance=0.001):
    """Return x with x ** 3 close to target (Newton-Raphson)."""
    guess = target
    while abs(guess ** 3 - target) >= tolerance:
        error = guess ** 3 - target
        guess = guess - error / (3 * guess ** 2)   # slope of x ** 3
    return guess

loads = [7, 2, 8]
low, high, mean = stats(loads)               # three values come back
print(low, high, mean)
print(stats(loads, digits=3))                # keyword argument
print(sorted(loads), loads)                  # a new sorted list
print(round(cube_root(27), 2), round(cube_root(8, tolerance=0.01), 2))
# >> Snek: "ONE BLOCK BECOMES FOUR LINES OF CALLS."
'''

tips = [
  "def f(x, digits=1) has a default; f(x) uses it, and f(x, digits=3) replaces it by keyword.",
  "return a, b hands back several values; unpack them with first, second = f(x).",
  "min(v), max(v) and sum(v) reduce a list to one number; sorted(v) returns a new sorted list.",
  "Split work into functions with a stated job. Newton-Raphson for a root of f(x) = 0: x = x - f(x) / slope(x).",
]

