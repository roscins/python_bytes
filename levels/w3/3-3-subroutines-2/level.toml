[[wave]]
kind = "build"
goal = "Write newton_root, then compare it with bisection."
brief = """
The starter has bisect_root(target, tolerance=0.01), which returns guess, tries. Write newton_root with the same parameters, return values and loop test, and a docstring.
It starts with guess = target and tries = 0, and each pass sets guess = guess - (guess ** 2 - target) / (2 * guess) and adds 1 to tries.
Call bisect_root(target), then print Bisection:, the tries and round(root, 2);
then call newton_root with target and the keyword tolerance=0.0001, and print Newton:, the tries and round(root, 4).
Keep target = 25 as the top line, and add a # comment.
"""
starter = '''
target = 25

def bisect_root(target, tolerance=0.01):
    """Return the square root of target by bisection, and the tries."""
    low = 0.0
    high = target
    guess = (low + high) / 2
    tries = 0
    while abs(guess ** 2 - target) >= tolerance:
        if guess ** 2 < target:
            low = guess
        else:
            high = guess
        guess = (low + high) / 2
        tries += 1
    return guess, tries
'''
reference = '''
target = 25

def bisect_root(target, tolerance=0.01):
    """Return the square root of target by bisection, and the tries."""
    low = 0.0
    high = target
    guess = (low + high) / 2
    tries = 0
    while abs(guess ** 2 - target) >= tolerance:
        if guess ** 2 < target:
            low = guess
        else:
            high = guess
        guess = (low + high) / 2
        tries += 1
    return guess, tries

def newton_root(target, tolerance=0.01):
    """Return the square root of target by Newton-Raphson, and the tries."""
    guess = target
    tries = 0
    while abs(guess ** 2 - target) >= tolerance:
        guess = guess - (guess ** 2 - target) / (2 * guess)
        tries += 1
    return guess, tries

# Compare the two methods
root, tries = bisect_root(target)
print("Bisection:", tries, round(root, 2))
root, tries = newton_root(target, tolerance=0.0001)
print("Newton:", tries, round(root, 4))
'''
