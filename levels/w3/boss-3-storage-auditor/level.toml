[level]
id = "boss-3"
title = "The Storage Auditor"
world = 3
boss = true
time_limit = 1200
sprite = "boss-storage-auditor"

cutscene = '''
# >> The vault doors grind shut. A tall machine unrolls a very long checklist.
book = ["cell", "fuse"]
copy_of_book = book
copy_of_book.append("ghost")
print(book)
# >> The official record now lists a ghost. Nobody delivered one.
# >> Snek: "AUDITOR DETECTED. THE BOOKS MUST BALANCE, TECHNICIAN."
'''

[[wave]]
kind = "boss"
goal = "Fix the delivery fault and write the audit report."
brief = """
Keep the data lines and the names delivery and minimum.

add_delivery(items, item): fix it to return a new list, leaving items unchanged.
audit(listed, seen): return three sorted lists without repeats, as a tuple: in both, only in listed, only in seen.
low_items(names, amounts, limit): return the names whose amount (same position) is below limit, in order.
fullest(names, amounts): return (name, amount) for the largest amount; the first one on a tie.

Then call them on book, delivery, scanned, counts and minimum, and print:
BOOK and book, then AFTER and the new list.
BOTH, MISSING and EXTRA, each with its list.
One line per low item: LOW, its number from 1, its name (LOW 1 fuse).
TOP, the name and the amount (TOP cell 8).
"""
starter = '''
# Storage audit
book = ["cell", "fuse", "gear", "lens"]
counts = [8, 2, 5, 1]
scanned = ["gear", "cell", "coil", "cell"]
delivery = "coil"
minimum = 3


def add_delivery(items, item):
    """Return a new list: items with item at the end."""
    new_items = items
    new_items.append(item)
    return new_items
'''
reference = '''
# Storage audit
book = ["cell", "fuse", "gear", "lens"]
counts = [8, 2, 5, 1]
scanned = ["gear", "cell", "coil", "cell"]
delivery = "coil"
minimum = 3


def add_delivery(items, item):
    """Return a new list: items with item at the end."""
    new_items = items.copy()
    new_items.append(item)
    return new_items


def audit(listed, seen):
    """Return three sorted lists: in both, missing and extra."""
    both = sorted(set(listed) & set(seen))
    missing = sorted(set(listed) - set(seen))
    extra = sorted(set(seen) - set(listed))
    return both, missing, extra


def low_items(names, amounts, limit):
    """Return the names whose amount is below limit, in order."""
    low = []
    for name, amount in zip(names, amounts):
        if amount < limit:
            low.append(name)
    return low


def fullest(names, amounts):
    """Return (name, amount) for the largest amount; first one on a tie."""
    best = 0
    for index, amount in enumerate(amounts):
        if amount > amounts[best]:
            best = index
    return names[best], amounts[best]


# The report
after = add_delivery(book, delivery)
print("BOOK", book)
print("AFTER", after)
both, missing, extra = audit(book, scanned)
print("BOTH", both)
print("MISSING", missing)
print("EXTRA", extra)
for number, name in enumerate(low_items(book, counts, minimum), start=1):
    print(f"LOW {number} {name}")
top_name, top_count = fullest(book, counts)
print("TOP", top_name, top_count)
'''
