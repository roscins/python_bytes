hints = [
  "Run the starter idea in your head: does new_items = items make a second list, or a second name?",
  "Copy before appending. Use set - and & in audit, zip in low_items, and track the best position in fullest.",
  "new_items = items.copy(), and in audit: missing = sorted(set(listed) - set(seen)).",
]

