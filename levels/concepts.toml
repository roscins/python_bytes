# Python Bytes – machine-readable curriculum.
# Human-readable twin: docs/curriculum.md. Change both in the same PR.
#
# Fields of a level:
#   concepts   2-4 headline concepts the player learns (bosses have none).
#   constructs what the level ADDS to the allowed set. The checker allows the
#              union of all constructs from this level and every earlier one,
#              in file order.
#   technique  true: the level teaches a method (an algorithm, a design
#              approach) rather than new syntax, so constructs may be empty.
#   recycles   earlier items whose material comes back in this level.
#   power_up   the terminal command the player earns (bosses have none).
#
# Forms of a construct (the full grammar is in docs/curriculum.md, section 6):
#   "Node"             an ast node type, e.g. "While". Allows all its sub-forms.
#   "Node:detail"      e.g. "BinOp:FloorDiv", "Compare:Is"
#   "call:name"        a call of a built-in, e.g. "call:print"
#   "method:name"      a method of a built-in str/list/dict/set/file
#   "import:module"    the module, its from-imports and everything module.*
#   "decorator:name"   e.g. "decorator:property"
#   "dunder:name"      a special method defined in a class, e.g. "dunder:__eq__"
#   "pattern:name"     a checker rule beyond plain syntax, e.g. "pattern:recursion"
#
# Always allowed, never listed: Module, Load, Store, Expr, and the name of a
# function that is being called.

[meta]
version = 2
levels_per_world = 5
outcome_codes = [
  "B1","B2","B3","B4","B5","B6","B7","B8","B9","B10","B11","B12",
  "A1","A2","A3","A4","A5","A6","A7","A8","A9",
  "R1","R2","R3","R4","R5","R6","R7","R8","R9","R10",
]

